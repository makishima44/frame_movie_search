<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101114" />
    <meta name="description" content="Discover movies and TV shows with Frame." />
    <script>
      try {
        const savedTheme = localStorage.getItem("movieSearch.theme");
        document.documentElement.dataset.theme = savedTheme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <title>Frame — Movie Search</title>
    <link rel="preconnect" href="https://www.omdbapi.com" />
    <link rel="preconnect" href="https://m.media-amazon.com" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#home" aria-label="Frame — home"
          ><span class="brand-mark">F</span><span>frame<span class="brand-dot">.</span></span></a
        >
        <div class="header-actions">
          <nav class="main-nav" aria-label="Main navigation">
            <button class="nav-link is-active" type="button" data-view="search">Discover</button>
            <button class="nav-link" type="button" data-view="favorites">Watchlist <span class="nav-count" id="favoriteCount">0</span></button>
          </nav>
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to light theme" title="Switch to light theme"><span aria-hidden="true">☼</span></button>
        </div>
      </header>

      <main id="home">
        <section class="hero" aria-labelledby="heroTitle">
          <div class="hero-copy">
            <h1 id="heroTitle">Your personal cinema</h1>
          </div>
        </section>

        <section class="search-panel" aria-label="Search and filters">
          <form id="movieSearchForm" class="search-form">
            <label class="search-field" for="movieSearchInput"
              ><span class="search-icon" aria-hidden="true"></span
              ><input type="search" id="movieSearchInput" name="title" placeholder="Search movies and TV shows" autocomplete="off"
            /></label>
            <button class="search-button" type="submit" id="movieSearchButton">Search <span aria-hidden="true">↗</span></button>
          </form>
          <div class="filter-row">
            <div class="type-tabs" role="group" aria-label="Media type">
              <button type="button" class="type-tab is-selected" data-type="" aria-pressed="true">Trending</button>
              <button type="button" class="type-tab" data-type="movie" aria-pressed="false">Movies</button>
              <button type="button" class="type-tab" data-type="series" aria-pressed="false">TV Shows</button>
            </div>
            <div class="filter-controls">
              <label class="filter-label" for="yearFilter"
                >Year <input id="yearFilter" type="number" inputmode="numeric" min="1888" placeholder="Any"
              /></label>
              <label class="filter-label" for="sortSelect"
                >Sort by
                <select id="sortSelect">
                  <option value="relevance">Popularity</option>
                  <option value="newest">Newest first</option>
                  <option value="oldest">Oldest first</option>
                  <option value="title">Title</option>
                </select>
              </label>
            </div>
          </div>
        </section>

        <section class="results-section" aria-live="polite">
          <div class="results-heading">
            <div>
              <p class="eyebrow" id="resultsEyebrow">NOW TRENDING</p>
              <h2 id="resultsTitle">Popular today</h2>
            </div>
            <p class="results-meta" id="resultsMeta"></p>
          </div>
          <div id="loadingContainer" class="loading-state" hidden><span class="spinner"></span><span>Finding your next watch…</span></div>
          <div id="movieContainer" class="movie-grid"></div>
          <div id="paginationContainer" class="pagination"></div>
        </section>
      </main>
      <footer class="footer">
        <span class="brand-mini">frame<span class="brand-dot">.</span></span
        ><span class="credits"><span>Catalog and search: TMDB API</span><span class="tmdb-credit"><a href="https://www.themoviedb.org" target="_blank" rel="noreferrer"><img src="https://www.themoviedb.org/assets/2/v4/logos/v2/blue_long_2-9665a76b1ae401a510ec1e0ca40ddcb3b0cfe45f1d51b77a308fea0845885648.svg" alt="The Movie Database" /></a><span>This product uses the TMDB API but is not endorsed or certified by TMDB.</span></span></span>
      </footer>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
